operations:
- operation_id: rerank
  display_name: Rerank documents
  description: Rank documents against a query. Returns original IDs, zero-based indices, and relevance scores.
  operation_kind: action
  workflow_visible: true
  connection_type_ids: [cohere_api]
  category: retrieval
  inputs:
  - {name: connection_ref, value_type: connection_ref, required: true, display_name: Cohere connection}
  - name: query
    value_type: text
    required: true
    display_name: Query
    schema: {type: string, minLength: 1, pattern: '\S'}
  - name: documents
    value_type: array
    required: true
    display_name: Documents
    schema:
      type: array
      minItems: 1
      maxItems: 1000
      items:
        type: object
        required: [id, text]
        properties:
          id: {type: string, minLength: 1, maxLength: 128, pattern: '\S'}
          text: {type: string, minLength: 1, pattern: '\S'}
  - name: model
    value_type: text
    required: false
    display_name: Model
    schema: {type: string, enum: [rerank-v3.5, rerank-v5.0-pro, rerank-v5.0-fast]}
  - name: top_n
    value_type: integer
    required: false
    display_name: Maximum results
    schema: {type: integer, minimum: 1, maximum: 1000}
  outputs:
  - {name: results, value_type: array}
  - {name: model, value_type: text}
  - {name: request_id, value_type: text}
  result_fields: [result.results, result.model, result.request_id]
  error_codes: [invalid_payload, invalid_connection, effect_claim_required, test_mode_suppressed, not_configured, authentication_failed, rate_limited, provider_unavailable, timeout]
- operation_id: embed
  display_name: Embed texts
  description: Generate one floating-point vector per text in input order.
  operation_kind: action
  workflow_visible: true
  connection_type_ids: [cohere_api]
  category: retrieval
  inputs:
  - {name: connection_ref, value_type: connection_ref, required: true, display_name: Cohere connection}
  - name: texts
    value_type: array
    required: true
    display_name: Texts
    schema:
      type: array
      minItems: 1
      maxItems: 96
      items: {type: string, minLength: 1, pattern: '\S'}
  - name: input_type
    value_type: text
    required: true
    display_name: Input type
    schema: {type: string, enum: [search_document, search_query, classification, clustering]}
  - name: model
    value_type: text
    required: false
    display_name: Model
    schema: {type: string, enum: [embed-v4.0, embed-v5.0-pro, embed-v5.0-fast]}
  - name: output_dimension
    value_type: text
    required: false
    display_name: Output dimensions
    schema: {type: [string, integer], enum: ['256', '512', '1024', '1536', 256, 512, 1024, 1536]}
  outputs:
  - {name: vectors, value_type: array}
  - {name: dimensions, value_type: number}
  - {name: model, value_type: text}
  - {name: request_id, value_type: text}
  result_fields: [result.vectors, result.dimensions, result.model, result.request_id]
  error_codes: [invalid_payload, invalid_connection, effect_claim_required, test_mode_suppressed, not_configured, authentication_failed, rate_limited, provider_unavailable, timeout]
