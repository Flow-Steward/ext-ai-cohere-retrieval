operations:
- operation_id: rerank
  display_name: Rank documents by relevance to a query
  description: Use a Cohere connection to reorder 1–1000 documents against a question or search query. Returns document
    IDs, original zero-based indices and relevance scores; it does not fetch documents or change an index.
  operation_kind: action
  workflow_visible: true
  connection_type_ids:
  - cohere_api
  category: retrieval
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
    display_name: Project connection
  - name: query
    value_type: text
    required: true
    display_name: Question or search query
    schema:
      type: string
      minLength: 1
      pattern: \S
  - name: documents
    value_type: array
    required: true
    display_name: Candidate documents (JSON array)
    schema:
      type: array
      minItems: 1
      maxItems: 1000
      items:
        type: object
        required:
        - id
        - text
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 128
            pattern: \S
          text:
            type: string
            minLength: 1
            pattern: \S
  - name: model
    value_type: text
    required: false
    display_name: Reranking model
    schema:
      type: string
      enum:
      - rerank-v3.5
      - rerank-v5.0-pro
      - rerank-v5.0-fast
  - name: top_n
    value_type: integer
    required: false
    display_name: Maximum documents to return
    schema:
      type: integer
      minimum: 1
      maximum: 1000
  outputs:
  - name: results
    value_type: array
  - name: model
    value_type: text
  - name: request_id
    value_type: text
  result_fields:
  - result.results
  - result.model
  - result.request_id
  error_codes:
  - invalid_payload
  - invalid_connection
  - effect_claim_required
  - test_mode_suppressed
  - not_configured
  - authentication_failed
  - rate_limited
  - provider_unavailable
  - timeout
- operation_id: embed
  display_name: Generate text embeddings
  description: Use a Cohere connection to generate one numeric vector per input text, preserving input order. Choose
    document or query input type for retrieval and keep model and dimensions consistent with your vector store.
  operation_kind: action
  workflow_visible: true
  connection_type_ids:
  - cohere_api
  category: retrieval
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
    display_name: Project connection
  - name: texts
    value_type: array
    required: true
    display_name: Texts to embed (JSON array)
    schema:
      type: array
      minItems: 1
      maxItems: 96
      items:
        type: string
        minLength: 1
        pattern: \S
  - name: input_type
    value_type: text
    required: true
    display_name: Embedding purpose
    schema:
      type: string
      enum:
      - search_document
      - search_query
      - classification
      - clustering
  - name: model
    value_type: text
    required: false
    display_name: Embedding model
    schema:
      type: string
      enum:
      - embed-v4.0
      - embed-v5.0-pro
      - embed-v5.0-fast
  - name: output_dimension
    value_type: text
    required: false
    display_name: Embedding dimensions
    schema:
      type:
      - string
      - integer
      enum:
      - '256'
      - '512'
      - '1024'
      - '1536'
      - 256
      - 512
      - 1024
      - 1536
  outputs:
  - name: vectors
    value_type: array
  - name: dimensions
    value_type: number
  - name: model
    value_type: text
  - name: request_id
    value_type: text
  result_fields:
  - result.vectors
  - result.dimensions
  - result.model
  - result.request_id
  error_codes:
  - invalid_payload
  - invalid_connection
  - effect_claim_required
  - test_mode_suppressed
  - not_configured
  - authentication_failed
  - rate_limited
  - provider_unavailable
  - timeout
