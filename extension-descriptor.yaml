schema_version: extension_descriptor_v1
lifecycle: {data_schema_version: 1, data_migrations: []}
extension_id: flowsteward.cohere-retrieval
release_version: 1.0.4
extension_type: service_extension
identity:
  display_name: Cohere Retrieval
  description: 'Improve search relevance and prepare text for similarity workflows with Cohere Retrieval. Its two
    actions rerank documents against a query or turn text into embedding vectors. Reranking accepts documents with
    your own IDs and returns their IDs, original positions and relevance scores, so later steps can select the most
    relevant material without losing its connection to the source.


    The embedding action returns one floating-point vector per input text in the original order, together with the
    selected model, vector dimensions and provider request ID. Choose the input type for search documents, search
    queries, classification or clustering. The release exposes Cohere Rerank v3.5 and v5 model options, alongside
    Embed v4 and v5 options with configurable dimensions.


    Use it to reorder candidate search results before an agent reads them, prepare text for a vector store, or feed
    similarity and classification steps. The extension supplies retrieval results rather than managing a knowledge-base
    index. Reranking accepts up to 1,000 documents; embedding accepts up to 96 texts per call. Text is sent to Cohere,
    where model access, quotas and billing apply.'
  tags:
  - cohere
  - retrieval
vendor: {vendor_name: Flow Steward, support_url: 'https://github.com/Flow-Steward/ext-ai-cohere-retrieval/issues'}
listing: {visibility: public_reference, category: ai}
distribution: {channel: private_byo, execution_modes: [local], allows_self_hosted: true, requires_connected_control_plane: false, import_sources: [file]}
runtime:
  contract_version: extension_host_v2
  compatibility: {platform_min: 1.4.0}
  extension_contract_v2:
    connection_types: contracts/connection_types.yaml
    operation_manifest: contracts/operation_manifest.yaml
    step_ui_manifest: contracts/step_ui_manifest.yaml
artifacts:
  extensions:
  - extension_id: flowsteward.cohere-retrieval
    ref: extension.yaml
    publish: true
provenance: {origin: imported, notes: Bundle-local contracts.}
commerce: {billing_mode: free}
