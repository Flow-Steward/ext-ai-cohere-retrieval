component_id: cohere_about
type: markdown
title: Cohere Retrieval
content: |
  Requires extension runtime contract 1.4.0 or later; compatibility is checked during installation.

  Use **Rerank documents** to order up to 1,000 documents for a query. Supply an array of objects such as `[{"id":"a","text":"A document"}]`; IDs must be unique and at most 128 characters. Results include the original ID, zero-based index, score and Cohere request ID. `top_n` is optional and must be an integer no greater than the number of documents. The server also checks IDs are unique.

  Use **Embed texts** to return one float vector for each of 1–96 texts, in order, along with dimensions, exact model ID and request ID. Choose search documents for stored passages and search queries for queries; classification and clustering are also available. Optional explicit dimensions are 256, 512, 1024 or 1536 for either model. Leave blank to use the model default: 1536 for v4 or 2048 for v5. Match model and dimensions throughout your own index.

  Add an Extension tools step to a workflow, choose the operation and your Cohere connection, then map the required inputs. Requests are limited to 2 MiB. Durable replay limits inline results to 512 KiB. The extension conservatively limits batches by selected dimensions; maximum texts per call are 32 at 256 dimensions, 16 at 512, 8 at 1024, 5 at 1536, and 4 at 2048. Split larger batches before running. Cohere truncates long inputs: Embed defaults to truncating the end, and Rerank defaults to 4096 tokens per document. Shorten or split text if preserving every part matters. Calls send the supplied text to Cohere and may incur charges. Flow Steward test mode suppresses calls. The host claims each paid operation before sending and does not automatically retry an uncertain outcome. This extension does not change Flow Steward knowledge-base indexes.
