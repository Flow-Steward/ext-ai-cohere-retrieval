actions:
- action_id: rerank
  workflow_visible: true
  title: Rerank documents
  description: Rank documents against a query and return original IDs and indices.
  required_scopes: ['extension:invoke']
  handler: {mode: extension}
  parameters:
  - {name: query, type: string, required: true}
  - {name: documents, type: array, required: true}
  - {name: model, type: string, required: false}
  - {name: top_n, type: integer, required: false}
  result_fields: [result.results, result.model, result.request_id]
  error_codes: [invalid_payload, not_configured, authentication_failed, rate_limited, provider_unavailable, timeout]
  mutates_platform: false
- action_id: embed
  workflow_visible: true
  title: Embed texts
  description: Generate one float vector per text.
  required_scopes: ['extension:invoke']
  handler: {mode: extension}
  parameters:
  - {name: texts, type: array, required: true}
  - {name: input_type, type: string, required: true}
  - {name: model, type: string, required: false}
  - {name: output_dimension, type: string, required: false}
  result_fields: [result.vectors, result.dimensions, result.model, result.request_id]
  error_codes: [invalid_payload, not_configured, authentication_failed, rate_limited, provider_unavailable, timeout]
  mutates_platform: false
